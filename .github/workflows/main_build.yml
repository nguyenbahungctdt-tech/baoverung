name: Unified Android & iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    # Create dummy google-services.json to prevent build failure if missing
    - name: Create Mock Google Services JSON
      run: |
        if [ ! -f "app/google-services.json" ]; then
          echo '{"project_info":{"project_number":"0","project_id":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"0","android_client_info":{"package_name":"com.baoverung.app"}},"api_key":[{"current_key":"mock"}]}]}' > app/google-services.json
        fi

    - name: Build Android Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Shared Framework
      run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

    - name: Build Xcode Project
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build/ios \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   clean build

    - name: Zip .app to .ipa (Unsigned)
      run: |
        mkdir -p build/ios/Payload
        cp -r build/ios/Build/Products/Release-iphoneos/iosApp.app build/ios/Payload/
        cd build/ios
        zip -r iosApp-unsigned.ipa Payload
        
    - name: Upload iOS IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-unsigned-ipa
        path: build/ios/iosApp-unsigned.ipa
