name: Unified Android & iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    # Create dummy google-services.json to prevent build failure if missing
    - name: Create Mock Google Services JSON
      run: |
        if [ ! -f "app/google-services.json" ]; then
          echo '{"project_info":{"project_number":"0","project_id":"mock"},"client":[{"client_info":{"mobilesdk_app_id":"0","android_client_info":{"package_name":"com.baoverung.app"}},"api_key":[{"current_key":"mock"}]}]}' > app/google-services.json
        fi

    - name: Build Android Debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Install ImageMagick
      run: brew install imagemagick

    - name: Generate App Icons
      run: |
        ICON_SRC="composeApp/src/commonMain/composeResources/drawable/app_icon_forestry.jpg"
        ICON_DEST="iosApp/iosApp/Assets.xcassets/AppIcon.appiconset"
        
        if [ ! -f "$ICON_SRC" ]; then
          echo "ERROR: Source icon not found at $ICON_SRC"
          exit 1
        fi
        
        mkdir -p $ICON_DEST
        
        # Create PNG images from source
        magick convert $ICON_SRC -resize 40x40 $ICON_DEST/icon-40.png
        magick convert $ICON_SRC -resize 60x60 $ICON_DEST/icon-60.png
        magick convert $ICON_SRC -resize 58x58 $ICON_DEST/icon-58.png
        magick convert $ICON_SRC -resize 87x87 $ICON_DEST/icon-87.png
        magick convert $ICON_SRC -resize 80x80 $ICON_DEST/icon-80.png
        magick convert $ICON_SRC -resize 120x120 $ICON_DEST/icon-120.png
        magick convert $ICON_SRC -resize 120x120 $ICON_DEST/icon-120-2.png
        magick convert $ICON_SRC -resize 180x180 $ICON_DEST/icon-180.png
        magick convert $ICON_SRC -resize 1024x1024 $ICON_DEST/icon-1024.png
        
        # Create Contents.json for Xcode
        cat > $ICON_DEST/Contents.json << 'EOF'
        {
          "images" : [
            { "filename" : "icon-40.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20" },
            { "filename" : "icon-60.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20" },
            { "filename" : "icon-58.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29" },
            { "filename" : "icon-87.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29" },
            { "filename" : "icon-80.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40" },
            { "filename" : "icon-120.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40" },
            { "filename" : "icon-120-2.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
            { "filename" : "icon-180.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
            { "filename" : "icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
          ],
          "info" : { "version" : 1, "author" : "xcode" }
        }
        EOF

    - name: Build Shared Framework
      run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

    - name: Build Xcode Project
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build/ios \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   clean build

    - name: Zip .app to .ipa (Unsigned)
      run: |
        mkdir -p build/ios/Payload
        cp -r build/ios/Build/Products/Release-iphoneos/iosApp.app build/ios/Payload/
        cd build/ios
        zip -r iosApp-unsigned.ipa Payload
        
    - name: Upload iOS IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-unsigned-ipa
        path: build/ios/iosApp-unsigned.ipa
