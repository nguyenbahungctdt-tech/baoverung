name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Cache Kotlin Native
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
        restore-keys: ${{ runner.os }}-konan-

    # Do không có Mac vật lý để ký code (Code Signing), 
    # bước này sẽ build một tệp .app (Simulator) hoặc .ipa không ký (Unsigned).
    # Để cài lên iPhone thật, bạn cần thêm chứng chỉ Apple P12 vào GitHub Secrets.
    
    - name: Build shared framework
      run: ./gradlew :composeApp:assembleComposeAppReleaseFrameworkIosArm64

    - name: Build Xcode Project
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build/ios \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Zip .app to .ipa (Unsigned)
      run: |
        mkdir -p build/ios/Payload
        cp -r build/ios/Build/Products/Release-iphoneos/iosApp.app build/ios/Payload/
        cd build/ios
        zip -r iosApp-unsigned.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: build/ios/iosApp-unsigned.ipa
