name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Install ImageMagick
      run: brew install imagemagick

    - name: Generate App Icons and Contents.json
      run: |
        ICON_SRC="app/src/main/res/drawable/app_icon_forestry.jpg"
        ICON_DEST="iosApp/iosApp/Assets.xcassets/AppIcon.appiconset"
        mkdir -p $ICON_DEST
        
        # Tạo các file ảnh PNG từ ảnh gốc
        magick convert $ICON_SRC -resize 40x40 $ICON_DEST/icon-40.png
        magick convert $ICON_SRC -resize 60x60 $ICON_DEST/icon-60.png
        magick convert $ICON_SRC -resize 58x58 $ICON_DEST/icon-58.png
        magick convert $ICON_SRC -resize 87x87 $ICON_DEST/icon-87.png
        magick convert $ICON_SRC -resize 80x80 $ICON_DEST/icon-80.png
        magick convert $ICON_SRC -resize 120x120 $ICON_DEST/icon-120.png
        magick convert $ICON_SRC -resize 180x180 $ICON_DEST/icon-180.png
        magick convert $ICON_SRC -resize 1024x1024 $ICON_DEST/icon-1024.png
        
        # Tạo tệp Contents.json để Xcode nhận diện ảnh
        cat > $ICON_DEST/Contents.json << 'EOF'
        {
          "images" : [
            { "idiom" : "iphone", "size" : "20x20", "scale" : "2x", "filename" : "icon-40.png" },
            { "idiom" : "iphone", "size" : "20x20", "scale" : "3x", "filename" : "icon-60.png" },
            { "idiom" : "iphone", "size" : "29x29", "scale" : "2x", "filename" : "icon-58.png" },
            { "idiom" : "iphone", "size" : "29x29", "scale" : "3x", "filename" : "icon-87.png" },
            { "idiom" : "iphone", "size" : "40x40", "scale" : "2x", "filename" : "icon-80.png" },
            { "idiom" : "iphone", "size" : "40x40", "scale" : "3x", "filename" : "icon-120.png" },
            { "idiom" : "iphone", "size" : "60x60", "scale" : "2x", "filename" : "icon-120.png" },
            { "idiom" : "iphone", "size" : "60x60", "scale" : "3x", "filename" : "icon-180.png" },
            { "idiom" : "ios-marketing", "size" : "1024x1024", "scale" : "1x", "filename" : "icon-1024.png" }
          ],
          "info" : { "version" : 1, "author" : "xcode" }
        }
        EOF

    # Biên dịch Release Framework cho iPhone
    - name: Build Shared Framework
      run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

    - name: Build Xcode Project
      run: |
        export JAVA_HOME=$JAVA_HOME_17_arm64
        xcodebuild -project iosApp/iosApp.xcodeproj \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build/ios \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   ACTION=build

    - name: Zip .app to .ipa (Unsigned)
      run: |
        mkdir -p build/ios/Payload
        cp -r build/ios/Build/Products/Release-iphoneos/iosApp.app build/ios/Payload/
        cd build/ios
        zip -r iosApp-unsigned.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: build/ios/iosApp-unsigned.ipa
